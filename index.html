<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>Normalize Endless Assistant</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;600;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;500;600;700&display=swap">
<style>
/* Layout: a sticky phase bar over one working column; panels pair up side by side on wide screens.
   Palette: Ghost violet for the interface, Normal khaki as the second voice (the build is Normal moves versus Ghost types).
   Type: a pixel display face for names and wave numbers, a high-legibility sans for everything you read mid-battle. */
:root {
  --bg: #efedf5;
  --surface: #faf9fd;
  --raised: #ffffff;
  --line: #cfc9e0;
  --line-soft: #e3dfee;
  --ink: #1f1a2e;
  --ink-2: #453e5e;
  --ink-3: #696281;
  --accent: #5440bd;
  --accent-ink: #ffffff;
  --accent-soft: #e5dffa;
  --khaki: #6f6740;
  --khaki-soft: #ece7d6;
  --go: #166a47;
  --go-soft: #d9f0e4;
  --warn: #8a5800;
  --warn-soft: #f9eaca;
  --stop: #a81f38;
  --stop-soft: #fadde2;
  --info: #23569f;
  --info-soft: #dde8fa;
  --shiny: #7d5a00;
  --shiny-soft: #fdeebf;
  --shadow: 0 1px 0 rgba(31, 26, 46, 0.06), 0 6px 18px -12px rgba(31, 26, 46, 0.35);
  --font-display: "Pixelify Sans", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible Next", "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace;
  --r: 4px;
  --gap: 16px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #13111c;
    --surface: #1b1829;
    --raised: #232036;
    --line: #3d3758;
    --line-soft: #2c2843;
    --ink: #ece9f6;
    --ink-2: #c3bddb;
    --ink-3: #9a93b8;
    --accent: #a898ff;
    --accent-ink: #171325;
    --accent-soft: #2e2852;
    --khaki: #d3c99f;
    --khaki-soft: #343023;
    --go: #62d49c;
    --go-soft: #16352a;
    --warn: #f0bd5c;
    --warn-soft: #3a2d12;
    --stop: #ff8fa0;
    --stop-soft: #431a23;
    --info: #92baff;
    --info-soft: #172a47;
    --shiny: #ffd866;
    --shiny-soft: #3c3110;
    --shadow: 0 1px 0 rgba(0, 0, 0, 0.3), 0 8px 20px -14px rgba(0, 0, 0, 0.8);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #13111c;
  --surface: #1b1829;
  --raised: #232036;
  --line: #3d3758;
  --line-soft: #2c2843;
  --ink: #ece9f6;
  --ink-2: #c3bddb;
  --ink-3: #9a93b8;
  --accent: #a898ff;
  --accent-ink: #171325;
  --accent-soft: #2e2852;
  --khaki: #d3c99f;
  --khaki-soft: #343023;
  --go: #62d49c;
  --go-soft: #16352a;
  --warn: #f0bd5c;
  --warn-soft: #3a2d12;
  --stop: #ff8fa0;
  --stop-soft: #431a23;
  --info: #92baff;
  --info-soft: #172a47;
  --shiny: #ffd866;
  --shiny-soft: #3c3110;
  --shadow: 0 1px 0 rgba(0, 0, 0, 0.3), 0 8px 20px -14px rgba(0, 0, 0, 0.8);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.5;
  -webkit-text-size-adjust: 100%;
}
h1, h2, h3, h4, p, ul, ol, dl, dd, figure { margin: 0; }
ul, ol { padding: 0; list-style: none; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); text-underline-offset: 2px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 2px; }
code, pre, .mono { font-family: var(--font-mono); font-size: 0.88em; }
.num { font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- top bar ---------- */
.bar {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 20;
  background: var(--surface);
  border-bottom: 2px solid var(--line);
}
.bar-in {
  max-width: 1200px;
  margin: 0 auto;
  padding: 8px 16px;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px 16px;
}
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand-mark {
  width: 30px; height: 30px; flex: none;
  display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr;
  border: 2px solid var(--ink); background: var(--ink); gap: 2px;
}
.brand-mark i { display: block; background: var(--khaki-soft); }
.brand-mark i:nth-child(2), .brand-mark i:nth-child(3) { background: var(--accent); }
.brand-name { font-family: var(--font-display); font-weight: 700; font-size: 19px; letter-spacing: 0.02em; line-height: 1.1; white-space: nowrap; }
.brand-sub { font-size: 11.5px; color: var(--ink-3); line-height: 1.2; }
.phases { display: flex; flex: 1 1 380px; min-width: 0; gap: 0; }
.phase-btn {
  flex: 1 1 0; min-width: 0;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  padding: 7px 8px;
  background: var(--raised);
  border: 2px solid var(--line);
  border-left-width: 0;
  cursor: pointer;
  font-weight: 600; font-size: 14px; color: var(--ink-2);
  white-space: nowrap;
}
.phase-btn:first-child { border-left-width: 2px; border-radius: var(--r) 0 0 var(--r); }
.phase-btn:last-child { border-radius: 0 var(--r) var(--r) 0; }
.phase-btn .n {
  font-family: var(--font-display); font-size: 13px; line-height: 1;
  width: 20px; height: 20px; display: grid; place-items: center; flex: none;
  background: var(--line-soft); color: var(--ink-2); border-radius: 2px;
}
.phase-btn[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.phase-btn[aria-selected="true"] .n { background: var(--accent-ink); color: var(--accent); }
.phase-btn .here { width: 7px; height: 7px; border-radius: 50%; background: var(--go); flex: none; }
.phase-btn[aria-selected="true"] .here { background: var(--accent-ink); }
.phase-label { overflow: hidden; text-overflow: ellipsis; }
.phase-label .short { display: none; }
.sync-pill {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 7px 12px; border: 2px solid var(--line); border-radius: var(--r);
  background: var(--raised); cursor: pointer; font-size: 13.5px; font-weight: 600; color: var(--ink-2);
  white-space: nowrap;
}
.sync-pill[aria-selected="true"] { border-color: var(--accent); color: var(--accent); }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--ink-3); flex: none; }
.dot.live { background: var(--go); box-shadow: 0 0 0 3px var(--go-soft); }
.dot.stale { background: var(--warn); }
.dot.sample { background: var(--info); }

/* ---------- page ---------- */
.shell { max-width: 1200px; margin: 0 auto; padding-inline: 16px; padding-block: 18px 72px; display: grid; gap: var(--gap); }
.view-head { display: grid; gap: 4px; }
.eyebrow { font-size: 12px; letter-spacing: 0.09em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; }
.view-head h1 { font-family: var(--font-display); font-weight: 700; font-size: 28px; line-height: 1.15; text-wrap: balance; }
.lede { color: var(--ink-2); max-width: 68ch; }
.cols { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: var(--gap); align-items: start; }
.col { display: grid; gap: var(--gap); min-width: 0; }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--gap); }
.grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--gap); }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); min-width: 0; }
.panel-h { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 12px; padding: 12px 14px 0; }
.panel-h h2 { font-family: var(--font-display); font-weight: 600; font-size: 18px; line-height: 1.25; }
.panel-h .meta { font-size: 13px; color: var(--ink-3); }
.panel-b { padding: 10px 14px 14px; display: grid; gap: 12px; min-width: 0; }
.panel.flat { background: transparent; border-style: dashed; }
.sub { font-size: 13px; color: var(--ink-3); }
.note { font-size: 13.5px; color: var(--ink-2); }
h3.h { font-size: 13px; letter-spacing: 0.07em; text-transform: uppercase; color: var(--ink-3); font-weight: 700; }

/* ---------- small parts ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 7px 12px; border-radius: var(--r); border: 2px solid var(--line);
  background: var(--raised); color: var(--ink); cursor: pointer; font-weight: 600; font-size: 14px; text-decoration: none;
}
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.small { padding: 3px 8px; font-size: 13px; border-width: 1px; }
.btn.link { border: 0; background: none; padding: 0; color: var(--accent); text-decoration: underline; font-weight: 500; }
.btn[disabled] { opacity: 0.5; cursor: default; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; min-width: 0; }
.row.between { justify-content: space-between; }
.grow { flex: 1 1 auto; min-width: 0; }

.pill {
  display: inline-flex; align-items: center; gap: 5px; padding: 1px 7px; border-radius: 2px;
  font-size: 12px; font-weight: 700; letter-spacing: 0.03em; text-transform: uppercase; white-space: nowrap;
  background: var(--line-soft); color: var(--ink-2);
}
.pill.ok { background: var(--go-soft); color: var(--go); }
.pill.todo { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--stop-soft); color: var(--stop); }
.pill.info { background: var(--info-soft); color: var(--info); }
.pill.shiny { background: var(--shiny-soft); color: var(--shiny); }
.pill.quiet { background: transparent; border: 1px solid var(--line); color: var(--ink-3); font-weight: 600; }

.type {
  display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; font-weight: 600; color: var(--ink-2); white-space: nowrap;
}
.type::before { content: ""; width: 9px; height: 9px; background: var(--t, var(--ink-3)); border: 1px solid var(--ink); flex: none; }
.types { display: inline-flex; flex-wrap: wrap; gap: 4px 8px; }
.ab { border-bottom: 1px dotted var(--ink-3); cursor: help; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  display: inline-flex; align-items: baseline; gap: 6px; padding: 2px 8px;
  border: 1px solid var(--line); border-radius: 2px; background: var(--raised); font-size: 13.5px; color: var(--ink);
}
button.chip { cursor: pointer; }
button.chip:hover { border-color: var(--accent); }
.chip small { color: var(--ink-3); font-size: 12px; }
.chip.weak { color: var(--ink-3); border-style: dashed; }
.chip.move { background: var(--khaki-soft); border-color: transparent; color: var(--ink); }
.chip.have { background: var(--go-soft); border-color: transparent; }
.chip.miss { background: var(--warn-soft); border-color: transparent; }

.callout { border-left: 4px solid var(--info); background: var(--info-soft); padding: 9px 12px; border-radius: 0 var(--r) var(--r) 0; display: grid; gap: 4px; }
.callout.warn { border-color: var(--warn); background: var(--warn-soft); }
.callout.danger { border-color: var(--stop); background: var(--stop-soft); }
.callout.good { border-color: var(--go); background: var(--go-soft); }
.callout.shiny { border-color: var(--shiny); background: var(--shiny-soft); }
.callout.plain { border-color: var(--line); background: var(--raised); }
.callout strong { font-weight: 700; }
.callout .t { font-weight: 700; }

/* boss-bar style progress: segments, like the game's boss health */
.segbar { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 2px; height: 10px; min-width: 60px; }
.segbar i { background: var(--line-soft); }
.segbar i.on { background: var(--accent); }
.segbar.go i.on { background: var(--go); }
.segbar.over i.on { background: var(--stop); }
.meter { display: grid; gap: 4px; }
.meter-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 13px; }
.meter-top strong { white-space: nowrap; }

/* ---------- checks and steps ---------- */
.checks { display: grid; gap: 6px; }
.check { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 8px; align-items: start; }
.mark {
  width: 20px; height: 20px; margin-top: 1px; display: grid; place-items: center; flex: none;
  border: 2px solid var(--line); border-radius: 2px; background: var(--raised); font-size: 12px; font-weight: 700; line-height: 1; color: transparent; padding: 0;
}
button.mark { cursor: pointer; }
button.mark:hover { border-color: var(--accent); }
.mark.ok { background: var(--go); border-color: var(--go); color: var(--surface); }
.mark.no { background: var(--stop-soft); border-color: var(--stop); color: var(--stop); }
.mark.locked { background: var(--warn-soft); border-color: var(--warn); color: var(--warn); }
.mark.info { background: var(--info-soft); border-color: var(--info); color: var(--info); }
.check-label { font-weight: 600; }
.check-detail { font-size: 13px; color: var(--ink-3); }

.steps { display: grid; gap: 0; }
.step { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 10px; padding: 10px 0; border-top: 1px solid var(--line-soft); }
.step:first-child { border-top: 0; padding-top: 2px; }
.step-title { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px; font-weight: 700; }
.step-n { font-family: var(--font-display); color: var(--ink-3); font-weight: 500; font-size: 13px; min-width: 1.6em; }
.step.done .step-title .t { color: var(--ink-3); text-decoration: line-through; text-decoration-thickness: 1px; }
.step-how { font-size: 13.5px; color: var(--ink-2); }
.step-detail { font-size: 13px; color: var(--ink-3); }
.step-detail.alert { color: var(--stop); font-weight: 600; }
.who { font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: var(--khaki); background: var(--khaki-soft); padding: 0 6px; border-radius: 2px; }

details { min-width: 0; }
summary { cursor: pointer; color: var(--accent); font-weight: 600; font-size: 13.5px; list-style: none; display: inline-flex; align-items: center; gap: 6px; }
summary::-webkit-details-marker { display: none; }
summary::before { content: "+"; font-family: var(--font-mono); width: 14px; display: inline-block; text-align: center; }
details[open] > summary::before { content: "−"; }
.details-body { padding: 8px 0 2px; display: grid; gap: 8px; }
.group-title { font-size: 12.5px; font-weight: 700; color: var(--ink-2); }
details.big > summary { font-size: 15px; color: var(--ink); padding: 10px 0; width: 100%; }
details.big { border-top: 1px solid var(--line-soft); }
details.big:first-of-type { border-top: 0; }
.numbered { display: grid; gap: 8px; counter-reset: n; }
.numbered > li { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 10px; counter-increment: n; }
.numbered > li::before {
  content: counter(n); font-family: var(--font-display); font-size: 14px; width: 24px; height: 24px; display: grid; place-items: center;
  background: var(--accent-soft); color: var(--accent); border-radius: 2px;
}
.numbered .d { font-size: 13.5px; color: var(--ink-2); }
.bullets { display: grid; gap: 6px; }
.bullets > li { padding-left: 16px; position: relative; }
.bullets > li::before { content: ""; position: absolute; left: 2px; top: 0.62em; width: 6px; height: 6px; background: var(--khaki); }

/* ---------- role cards ---------- */
.role-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px 14px; display: grid; gap: 10px; align-content: start; min-width: 0; }
.role-top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 10px; }
.role-name { font-family: var(--font-display); font-size: 18px; font-weight: 600; }
.role-job { font-size: 13.5px; color: var(--ink-2); }
.mon-id { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; font-size: 13.5px; }
.mon-id .cost { font-weight: 700; }
select, input[type="number"], input[type="text"], input[type="search"], textarea {
  background: var(--raised); border: 2px solid var(--line); border-radius: var(--r); padding: 5px 8px; min-width: 0; max-width: 100%;
}
select:hover, input:hover, textarea:hover { border-color: var(--ink-3); }
input[type="number"] { width: 6.5em; }
label.field { display: grid; gap: 3px; font-size: 13px; color: var(--ink-2); font-weight: 600; min-width: 0; }
.stepper { display: inline-flex; align-items: center; border: 2px solid var(--line); border-radius: var(--r); overflow: hidden; background: var(--raised); }
.stepper button { border: 0; background: none; width: 26px; height: 26px; cursor: pointer; font-weight: 700; }
.stepper button:hover { background: var(--accent-soft); }
.stepper output { min-width: 2.2em; text-align: center; font-variant-numeric: tabular-nums; font-weight: 700; font-size: 13.5px; }
.switch { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-weight: 600; }
.switch input { width: 18px; height: 18px; accent-color: var(--accent); flex: none; margin: 0; }
.switch:has(input:disabled) { opacity: 0.55; cursor: default; }
.numbered .switch { display: flex; align-items: flex-start; }
.numbered .switch input { margin-top: 2px; }

/* ---------- tables ---------- */
.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; padding: 6px 10px 6px 0; vertical-align: top; border-top: 1px solid var(--line-soft); }
thead th { border-top: 0; font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-3); font-weight: 700; padding-bottom: 4px; white-space: nowrap; }
tbody tr:first-child td, tbody tr:first-child th { border-top: 1px solid var(--line); }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
tbody th { font-weight: 700; }

.budget { display: grid; gap: 0; }
.budget-row { display: grid; grid-template-columns: minmax(0, 1.5fr) 64px 124px 64px minmax(0, 1.3fr); gap: 4px 12px; align-items: center; padding: 7px 0; border-top: 1px solid var(--line-soft); }
.budget-row:first-child { border-top: 0; }
.budget-row .lbl { display: block; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-3); font-weight: 700; line-height: 1.3; }
.b-name { min-width: 0; display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; }
.b-cost strong { font-size: 17px; }
.audit { display: grid; gap: 14px; }
.audit-role { display: grid; gap: 6px; }
.audit-row { display: grid; grid-template-columns: minmax(0, 1fr) auto 84px; gap: 10px; align-items: center; font-size: 14px; }
.audit-row .cnt { font-variant-numeric: tabular-nums; font-weight: 700; white-space: nowrap; }
.audit-row.done .cnt { color: var(--go); }

/* ---------- field: enemies, verdict, ruler ---------- */
.verdict { border: 2px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: grid; gap: 8px; background: var(--raised); }
.verdict-call { font-family: var(--font-display); font-weight: 700; font-size: 34px; line-height: 1.05; letter-spacing: 0.01em; text-wrap: balance; }
.verdict.run { border-color: var(--go); background: var(--go-soft); }
.verdict.run .verdict-call { color: var(--go); }
.verdict.stay { border-color: var(--shiny); background: var(--shiny-soft); }
.verdict.stay .verdict-call { color: var(--shiny); }
.verdict.steal { border-color: var(--khaki); background: var(--khaki-soft); }
.verdict.steal .verdict-call { color: var(--khaki); }
.verdict.gastro { border-color: var(--warn); background: var(--warn-soft); }
.verdict.gastro .verdict-call { color: var(--warn); }
.verdict.boss { border-color: var(--stop); background: var(--stop-soft); }
.verdict.boss .verdict-call { color: var(--stop); }
.wave-line { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; }
.wave-num { font-family: var(--font-display); font-weight: 700; font-size: 26px; line-height: 1; font-variant-numeric: tabular-nums; }
.foes { display: grid; gap: 8px; }
.foe { border: 1px solid var(--line); border-radius: var(--r); padding: 8px 10px; display: grid; gap: 5px; background: var(--raised); min-width: 0; }
.foe.wanted { border-color: var(--shiny); border-width: 2px; }
.foe.steal { border-color: var(--khaki); }

.ruler-cells i.x0 { background: var(--khaki); }

.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { width: 10px; height: 10px; display: inline-block; background: var(--line); }
.legend i.x0 { background: var(--khaki); }
.legend i.forced { background: var(--stop); }
.legend i.now { background: var(--accent); }

.slots { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.slot { border: 1px solid var(--line); border-radius: var(--r); padding: 8px 10px; background: var(--raised); display: grid; gap: 3px; min-width: 0; }

.kv.tight { font-size: 13px; gap: 2px 10px; }

.kv { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 14px; font-size: 14px; }

.kv dd { font-weight: 600; min-width: 0; }

  }

  }

  /**
   * Everything worth saying about one wild Pokémon on the current wave.
   * phase: "carry" or "run". Uses exact ability and moves only when ctx.peek is on.

    if (!desc) return { desc: null, alerts: [{ sev: "info", text: "Unknown species #" + enemy.species + " (newer than this page's game data).", want: false }], wanted: false, steal: false, gas: "no" };
    function add(sev, text, want) { alerts.push({ sev: sev, text: text, want: !!want }); }

    if (enemy.shiny) add("shiny", "Shiny" + (enemy.variant ? " (tier " + (enemy.variant + 1) + ")" : "") + ". Master Ball it, or use the safe-capture steps.", true);

      if (!caught) add("want", data.sp(enemy.species).n + " is not in your dex yet.", true);
      else if (dexNews(enemy, ctx.system)) add("want", "Something about this " + data.sp(enemy.species).n + " is new to your dex. Catch it.", true);

    matches.forEach(function (m) {
      if (m.weak) return;

    var forcedWave = ctx.session ? adv.waveInfo(ctx.session.wave).forced : false;
    wantedItems(enemy, ctx).forEach(function (it) {
      add("item", "Holds " + it.count + " × " + it.name + ", which you are still short of. " +

    });

    var wanted = alerts.some(function (a) { return a.want && a.sev !== "item"; });
    var steal = alerts.some(function (a) { return a.want && a.sev === "item"; });

  }

  /** The per-wave call while running: three checks, then flee. */
  function verdict(ctx) {
    var s = ctx.session;
    if (!s) return null;
    var info = adv.waveInfo(s.wave);
    var scans = s.enemies.map(function (e) { return scanEnemy(e, ctx, "run"); });
    var runner = ctx.assign.byRole.runner;
    var fieldSlots = s.double ? 2 : 1;
    var runnerIdx = runner ? s.party.indexOf(runner) : -1;
    var runnerOut = runnerIdx !== -1 && runnerIdx < fieldSlots && runner.hp > 0;
    var runAway = !!runner && runner.passiveOn && runner.passive === A("RUN_AWAY") || (!!runner && runner.ability === A("RUN_AWAY"));

    if (info.forced) {
      return { action: "boss", title: adv.kindLabel(info.kind), info: info, scans: scans, notes: ["No fleeing and no catching on this wave. Gouot must be on the field when it ends."], reasons: [], catches: [], steals: [] };
    }
    var catches = [], steals = [];

    else if (!runnerOut) notes.push(runner.name + " is not on the field (slot " + (runnerIdx + 1) + " in a " + (s.double ? "double" : "single") + " battle). Run Away only works for a Pokémon that is out.");
    if (info.kind === "x0") notes.push("X0 wave: bosses cannot be Roared away. If you stay, Trick-or-Treat the one you want and Entrainment its partner.");
    // catch-worthy beats everything; Neutralizing Gas has to be answered before you can leave; items are a quick Thief
    var action = catches.length ? "stay" : gasYes ? "gastro" : steals.length ? "steal" : "run";
    var busy = action === "stay" || action === "steal";

    var title = { stay: "Stay", steal: "Steal, then run", gastro: "Gastro Acid, then run", run: "Run" }[action];
    return { action: action, title: title, info: info, scans: scans, reasons: catches.concat(steals), catches: catches, steals: steals, notes: notes };
  }

  NZ.advisor.describe = describe;
  NZ.advisor.bossNotes = bossNotes;
  NZ.advisor.bossDossier = bossDossier;
  NZ.advisor.scout = scout;
  NZ.advisor.scanEnemy = scanEnemy;
  NZ.advisor.verdict = verdict;
  NZ.advisor.wantedItems = wantedItems;
  NZ.advisor.dexNews = dexNews;
})();

      var candy = r.nextCost == null ? "fully reduced" : "next: " + r.nextCost + " candies" + (r.candy != null ? " (you have " + r.candy + ")" : "");
      return '<li class="budget-row"><div class="b-name"><strong>' + h(sp.n) + '</strong> <span class="who">' + h(kb.roles[r.role].name) + '</span></div><div class="b-base"><span class="lbl">Base</span><span class="num">' + r.base +
        '</span></div><div class="b-red"><span class="lbl">Reductions</span>' + control + '</div><div class="b-cost"><span class="lbl">Cost</span><strong class="num">' + r.cost + '</strong></div><div class="b-next sub">' + candy + "</div></li>";
    }).join("");
    var verdict = b.over
      ? H.callout("warn", b.total + " of 15 points: " + b.over + " over", "Buy candy cost reductions until the six fit. Each reduction takes 1 point off a starter that costs more than 1, then halves it. Fully reduced, this team costs " + b.floor + ".")
      : H.callout("good", b.total + " of 15 points: the team fits", b.total < 15 ? (15 - b.total) + " to spare." : "Exactly on the limit.");
    return H.panel("Starter points", '<div class="meter"><div class="meter-top"><span>Endless gives you 15 starter points</span><strong class="num">' + b.total + " / 15</strong></div>" + bar + "</div>" + verdict +
      '<ul class="budget">' + rows + "</ul>",
      ctx.system ? "reductions read from your save" : "set your reductions by hand, or sync");
  }

  function checkRow(role, c) {
    var st = c.state;
    var manualOn = st === "manual" && ui.state.unlocks[role] && ui.state.unlocks[role][c.id];
    var shown = manualOn ? "ok" : st;
    var markHtml = st === "manual"
      ? H.mark(shown, 'data-act="unlock" data-role="' + role + '" data-id="' + h(c.id) + '" aria-pressed="' + !!manualOn + '" title="Tick when you have it"')
      : H.mark(shown);
    return '<li class="check">' + markHtml + '<div><div class="check-label">' + h(c.label) + (st === "locked" ? " " + H.pill("locked", "todo") : "") + (st === "no" ? " " + H.pill("does not fit", "bad") : "") +
      "</div>" + (c.detail ? '<div class="check-detail">' + h(c.detail) + "</div>" : "") + "</div></li>";
  }

  function roleCard(role, ctx) {
    var id = ctx.roster[role], sp = data.sp(id), need = kb.needs[role];
    var formIndex = adv.roleForm(role, id);
    var alts = adv.alternatives(role);
    var options = alts.map(function (a) {
      var label = data.name(a.id, a.form) + (data.sp(a.id).c ? " · " + data.sp(a.id).c + " pts" : "") + (a.note ? " · " + a.note : "");
      return '<option value="' + a.id + '"' + (a.id === id ? " selected" : "") + ">" + h(label) + "</option>";
    }).join("");
    if (!alts.some(function (a) { return a.id === id; })) options = '<option value="' + id + '" selected>' + h(sp.n) + "</option>" + options;
    var checks = adv.starterChecks(role, id, ctx.system);
    var open = checks.filter(function (c) { return c.state === "locked" || c.state === "no"; }).length;
    var todoManual = checks.filter(function (c) { return c.state === "manual" && !(ui.state.unlocks[role] && ui.state.unlocks[role][c.id]); }).length;
    var status = open ? H.pill(open + " to fix", "todo") : todoManual ? H.pill(todoManual + " to confirm", "quiet") : H.pill("ready", "ok");
    return '<article class="role-card"><div class="role-top"><span class="role-name">' + h(kb.roles[role].name) + "</span>" + status + "</div>" +
      '<label class="field"><span class="sr">Starter for ' + h(kb.roles[role].name) + '</span><select id="pick-' + role + '" data-bind="roster.' + role + '" data-num="1">' + options + "</select></label>" +
      '<div class="mon-id">' + H.typeChips(data.form(id, formIndex).types) + '<span class="cost num">' + (sp.c || "–") + " pts</span>" + (sp.k !== kb.roles[role].pick ? H.pill("alternative", "info") : "") + "</div>" +
      '<p class="role-job">' + h(kb.roles[role].job) + "</p>" +
      '<ul class="checks">' + checks.map(function (c) { return checkRow(role, c); }).join("") + "</ul>" +
      (need.altNote ? '<p class="sub">' + h(need.altNote) + "</p>" : "") + "</article>";
  }

  function teamPanel() {
    var rows = ["staller", "runner", "partner", "killer"].map(function (role) {
      var t = kb.finalTeam[role];
      var moves = t.moves.map(function (m) {
        var keys = Array.isArray(m) ? m : [m];
        return '<span class="chip move">' + keys.map(function (k) { return h(data.mv(data.M[k]).name); }).join(" or ") + "</span>";
      }).join("");
      var items = Object.keys(t.items).map(function (k) { return '<span class="chip">' + h(kb.itemInfo[k].name) + " <small>×" + t.items[k] + "</small></span>"; }).join("");
      return '<div class="team-row"><div class="row between"><span class="team-name">' + h(t.name) + '</span><span class="sub">' + h(t.made) + "</span></div>" +
        '<dl class="kv"><dt>Ability / passive</dt><dd>' + h(t.ability) + " / " + h(t.passive) + "</dd><dt>Nature</dt><dd>" + h(t.nature) + (t.tera ? " · Tera Ghost" : "") + "</dd></dl>" +
        '<div class="chips">' + moves + '</div><div class="chips">' + items + '</div><p class="note">' + h(t.why) + "</p></div>";
    }).join("");
    return H.panel("What you are building toward", '<p class="note">Four fusions do everything; the last two slots stay free. In every fusion the Pokémon named first keeps its passive and nature, and the second gives its ability.</p><div class="team">' + rows + "</div>", "the final team");
  }

  function variantsPanel() {
    var body = kb.variants.map(function (v) {
      return '<div><div class="check-label">' + h(v.name) + '</div><div class="note">' + h(v.change) + " " + h(v.trade) + "</div></div>";
    }).join("");
    return H.panel("Variants", body, "if you are missing an unlock");
  }

  ui.views.party = function (ctx) {
    var syncNote = ctx.system
      ? H.callout("good", "Unlocks read from your save", "Passives, hidden abilities, natures, egg moves, IVs and candy counts below come from the system save synced " + h(util.ago(ui.game.at)) + ".")
      : H.callout("plain", "Check your unlocks automatically", 'Sync your save and every tick below fills itself in from your real unlocks. <button type="button" class="btn link" data-act="tab" data-tab="sync">Open Sync</button>');
    var cards = kb.ROLE_ORDER.map(function (role) { return roleCard(role, ctx); }).join("");
    return '<div class="view-head"><p class="eyebrow">Phase 1</p><h1>Party building</h1><p class="lede">Six starters chosen for their passives. Unlock every passive and hidden ability before the run starts: they do not unlock mid-run. Keep the first four unevolved until their fusions.</p></div>' +
      syncNote + budgetPanel(ctx) + '<div class="grid-3">' + cards + "</div>" + '<div class="cols"><div class="col">' + teamPanel() + '</div><div class="col">' + variantsPanel() +
      '<div class="row"><button type="button" class="btn primary" data-act="tab" data-tab="carry">Team picked: go to Carry</button></div></div></div>';
  };

  ui.on("unlock", function (t) {
    var role = t.getAttribute("data-role"), id = t.getAttribute("data-id");
    var u = ui.state.unlocks[role] || (ui.state.unlocks[role] = {});
    if (u[id]) delete u[id]; else u[id] = true;
    ui.persist(); ui.render();
  });
})();

/* 52-ui-field.js */
/* Pieces shared by the Carry and Running views: the current wave, the lure picture and the scout box. */
(function () {
  "use strict";
  var ui = NZ.ui, util = NZ.util, data = NZ.data, kb = NZ.kb, adv = NZ.advisor, h = util.esc, H = ui.html;

  var ALERT_PILL = { shiny: ["shiny", "shiny"], want: ["catch", "ok"], maybe: ["check", "info"], item: ["item", "todo"], info: ["note", "quiet"] };
  var KIND_PILL = { normal: "quiet", x0: "todo", paradox: "bad", eternatus: "bad", eternamax: "bad" };

  function itemList(items) {
    var keys = Object.keys(items || {});
    if (!keys.length) return "";
    return keys.map(function (k) {
      var name = kb.itemInfo[k] ? kb.itemInfo[k].name : k.toLowerCase().replace(/_/g, " ").replace(/\b\w/g, function (c) { return c.toUpperCase(); });
      return h(name) + (items[k] > 1 ? " ×" + items[k] : "");
    }).join(", ");
  }

  function waveLine(session) {
    var info = adv.waveInfo(session.wave);
    return '<div class="wave-line"><span class="wave-num">Wave ' + util.fmt(session.wave) + "</span>" + H.pill(adv.kindLabel(info.kind), KIND_PILL[info.kind]) +
      '<span class="sub">' + h(data.biomeName(session.biome)) + " · " + (session.double ? "double battle" : "single battle") + (session.endless ? "" : " · not an Endless run") + "</span></div>";
  }

  function hiddenLine(e) {
    if (!e.known) return "";
    var moves = e.moves.map(function (m) { return H.moveChip(m); }).join("");
    return '<div class="sub">Ability ' + H.ab(e.ability) + (e.passiveOn ? " · passive " + H.ab(e.passive) : "") + (e.stats.length ? ' · Speed <span class="num">' + util.short(e.stats[5]) + "</span>" : "") + '</div><div class="chips">' + moves + "</div>";
  }

  function foeCard(enemy, scan, ctx) {
    var tags = "";
    if (enemy.shiny) tags += " " + H.pill("shiny", "shiny");
    if (enemy.boss) tags += " " + H.pill("boss" + (enemy.segments ? " · " + enemy.segments + " bars" : ""), "bad");
    if (enemy.fusion) tags += " " + H.pill("fusion", "info");
    var items = itemList(enemy.items);
    var alerts = scan.alerts.map(function (a) {
      var p = ALERT_PILL[a.sev] || ALERT_PILL.info;
      return '<li class="alert">' + H.pill(p[0], p[1]) + "<span>" + h(a.text) + "</span></li>";
    }).join("");
    return '<div class="foe' + (scan.wanted ? " wanted" : scan.steal ? " steal" : "") + '"><div class="foe-top">' + H.monHead(enemy) + tags + "</div>" +
      (items ? '<div class="sub">Holds: ' + items + "</div>" : "") + (ctx.peek ? hiddenLine(enemy) : "") +
      (alerts ? '<ul class="alerts">' + alerts + "</ul>" : '<div class="sub">Nothing here for the build.</div>') +
      '<div><button type="button" class="btn link" data-act="scout" data-id="' + enemy.species + '" data-form="' + enemy.form + '">Species details</button></div></div>';
  }

  function ruler(wave) {
    var start = Math.floor((wave - 1) / 50) * 50 + 1;
    var cells = "";
    for (var i = 0; i < 50; i++) {
      var w = start + i;
      var cls = w === wave ? "now" : w % 50 === 0 ? "forced" : w % 10 === 0 ? "x0" : w < wave ? "past" : "";
      cells += "<i" + (cls ? ' class="' + cls + '"' : "") + ' title="Wave ' + w + '"></i>';
    }
    var labels = "";
    for (var l = 0; l <= 5; l++) labels += "<span>" + util.fmt(l === 0 ? start : start + l * 10 - 1) + "</span>";
    return '<div class="ruler" role="img" aria-label="Position in the 50-wave cycle: wave ' + wave + " of " + start + " to " + (start + 49) + '"><div class="ruler-cells">' + cells +
      '</div><div class="ruler-labels">' + labels + '</div><div class="legend"><span><i class="now"></i>you</span><span><i class="x0"></i>X0 boss wave</span><span><i class="forced"></i>forced boss (no flee, no catch)</span></div></div>';
  }

  function odds(p) { return p >= 1 ? "guaranteed" : p <= 0 ? "never" : p === 0.5 ? "1 in 2" : "1 in " + Math.round(1 / p); }

  function lurePanel(ctx, phase) {
    var body = "";
    if (ctx.session) {
      var ls = adv.lureStatus(ctx.session);
      var slots = ls.field.map(function (f, i) {
        var lures = f.lures.length ? f.lures.map(function (a) { return H.ab(a); }).join(" + ") : "no lure";
        return '<div class="slot' + (f.fainted ? " off" : "") + '"><span class="slot-n">Slot ' + (i + 1) + (f.fainted ? " · fainted" : "") + "</span><strong>" + h(f.member.name) + "</strong><span class=\"sub\">" + lures + "</span></div>";
      }).join("");
      if (ls.field.length === 1) slots += '<div class="slot off"><span class="slot-n">Slot 2</span><strong>not on the field</strong><span class="sub">single battle: only slot 1 counts</span></div>';
      var itemTxt = ls.items.length ? ls.items.map(function (l) { return h(l.tier.replace(/_/g, " ").toLowerCase().replace(/\b\w/g, function (c) { return c.toUpperCase(); })) + " (" + l.left + " battles left)"; }).join(", ") : "no lure item";
      var next = ls.next;
      var nextInfo = adv.waveInfo(next);
      var nextText = nextInfo.forced ? "a forced single boss" : odds(ls.nextChance) + (ls.nextChance >= 1 ? " double" : " for a double");
      body += '<div class="slots">' + slots + "</div>" +
        '<dl class="kv"><dt>Lure sources</dt><dd class="num">' + ls.count + " (" + ls.sources.length + " on the field, " + ls.items.length + " item" + (ls.items.length === 1 ? "" : "s") + ")</dd><dt>Bag</dt><dd>" + itemTxt +
        "</dd><dt>Wave " + util.fmt(next) + "</dt><dd>" + nextText + "</dd><dt>At this count</dt><dd>normal waves " + odds(ls.normalChance) + ", X0 waves " + odds(ls.x0Chance) + "</dd></dl>";
      var staller = ctx.assign.byRole.staller;
      if (phase === "run" && staller && ctx.session.party.indexOf(staller) !== 0) body += H.callout("warn", staller.name + " is not in slot 1", "The lure roll uses the Pokémon on the field when the battle ends. Keep " + h(staller.name) + " first so it is out after every wave, forced bosses included.");
      if (ls.field.some(function (f) { return f.fainted && f.lures.length === 0; }) || ls.field.some(function (f) { return f.fainted; })) body += H.callout("warn", "A fainted Pokémon's lures do not count", "Revive it before the battle ends.");
    } else {
      body += '<p class="note">Each lure source on the field when a battle ends divides the odds by 4: a lure ability, a lure passive, or a lure item tier in the bag. The roll uses slot 1, plus slot 2 after a double.</p>' +
        '<div class="table-wrap"><table><thead><tr><th>Sources</th><th>Normal wave</th><th>X0 wave</th></tr></thead><tbody>' +
        [0, 1, 2, 3].map(function (n) { return '<tr><th class="num">' + n + "</th><td>" + odds(adv.doubleChance(1, n)) + "</td><td>" + odds(adv.doubleChance(10, n)) + "</td></tr>"; }).join("") + "</tbody></table></div>";
    }
    if (phase === "carry") {
      body += '<ul class="bullets"><li><strong>Regigigas first, always.</strong> Pumpkaboo or Gourgeist second, for its Illuminate.</li><li>Regigigas has no lure, so until the fast lure fusion lands, Illuminate is the only source: normal waves 1 in 2, X0 waves 1 in 8. A lure item in the bag is one more source while it lasts (normal waves guaranteed, X0 waves 1 in 2). Take a lure when the shop offers one; two tiers at once make X0 waves doubles too. Once Gourgeist has No Guard as well, normal waves are guaranteed without one.</li><li>After a single battle only slot 1 is out, so the next wave rolls without the Illuminate in slot 2.</li></ul>';
    } else {
      body += '<ul class="bullets"><li><strong>Mega Gouot in slot 1, Teddiurk in slot 2.</strong> Three sources guarantee every wave, X0 included.</li><li>After a forced boss only Gouot is out; its two sources still guarantee the next normal wave, so the chain restarts by itself.</li><li>No lure item is needed, ever. If Teddiurk fainted or was switched out, an X0 wave is 1 in 2 for one wave and the chain picks up again.</li></ul>';
    }
    return H.panel("Doubles chain", body, "who is out when the battle ends");
  }

  function scoutCard(id, formIndex, ctx, phase) {
    var sp = data.sp(id);
    if (!sp) return "";
    var f = data.form(id, formIndex);
    var subject = { species: id, form: formIndex, level: 0, items: {}, passiveOn: false };
    var matches = adv.scout(subject, ctx, false);
    var abilities = f.abilities.map(function (a, i) { return a ? H.ab(a) + (i === 2 ? ' <span class="sub">(hidden)</span>' : "") : null; }).filter(Boolean);
    var seen = {};
    abilities = abilities.filter(function (x) { if (seen[x]) return false; seen[x] = 1; return true; });
    var lm = data.levelMoves(id, formIndex).slice().sort(function (a, b) { return a[0] - b[0]; });
    var moveChips = lm.map(function (p) { return '<span class="chip' + (p[0] < 0 ? " weak" : "") + '">' + h(data.mv(p[1]).name) + " <small>" + h(adv.lvlLabel(p[0])) + "</small></span>"; }).join("");
    var dex = "";
    if (ctx.system) dex = ctx.system.caught.indexOf(id) !== -1 ? H.pill("in your dex", "ok") : H.pill("not caught yet", "todo");
    var forms = "";
    if (sp.f && sp.f.length > 1) {
      forms = '<div class="chips">' + sp.f.map(function (ff, i) {
        return '<button type="button" class="chip' + (i === formIndex ? " have" : "") + '" data-act="scout" data-id="' + id + '" data-form="' + i + '">' + h(ff[1] || "Base") + "</button>";
      }).join("") + "</div>";
    }
    var list = matches.length ? '<ul class="alerts">' + matches.map(function (m) {
      return '<li class="alert">' + H.pill(m.weak ? "no" : m.kind === "fuse" ? "fusion" : m.kind === "carbos" ? "carbos" : "move", m.weak ? "quiet" : "ok") + "<span>" + h(m.text) + "</span></li>";
    }).join("") + "</ul>" : '<p class="sub">Nothing on your open splice steps needs this species.</p>';
    var boss = adv.bossNotes(adv.describe({ species: id, form: formIndex, passiveOn: true, boss: true }, false), {});
    var threat = boss.notes.filter(function (n) { return n.sev === "danger" || n.sev === "care"; }).slice(0, 4).map(function (n) {
      return '<li class="alert">' + H.pill(n.sev === "danger" ? "danger" : "care", n.sev === "danger" ? "bad" : "todo") + "<span><strong>" + h(n.title) + ".</strong> " + h(n.text) + "</span></li>";
    }).join("");
    return '<div class="foe"><div class="foe-top"><span class="foe-name">' + h(data.name(id, formIndex)) + "</span>" + H.typeChips(f.types) + dex + (sp.c ? '<span class="sub num">starter · ' + sp.c + " pts</span>" : "") + "</div>" + forms +
      '<dl class="kv"><dt>Abilities</dt><dd>' + abilities.join(", ") + "</dd><dt>Passive</dt><dd>" + H.ab(data.passive(id, formIndex)) + ' <span class="sub">(bosses and unlocked starters only)</span></dd><dt>Base Speed</dt><dd class="num">' + f.stats[5] + "</dd></dl>" +
      '<h3 class="h">For your build</h3>' + list +
      (threat ? H.details("scout-threat", "If you had to fight it as a boss", '<ul class="alerts">' + threat + "</ul>") : "") +
      H.details("scout-moves", "Level-up moves (" + lm.length + ")", '<div class="chips">' + moveChips + '</div><p class="sub">Wild Pokémon only know level-up moves. A fused Pokémon can relearn any of these with a Memory Mushroom.</p>') + "</div>";
  }

  function scoutPanel(ctx, phase) {
    var st = ui.state;
    var card = st.scout ? scoutCard(st.scout, st.scoutForm || 0, ctx, phase) : '<p class="sub">Type a wild Pokémon\'s name to see what it offers: moves for an open splice step, a Sturdy or lure ability, or a free-slot role.</p>';
    return H.panel("Scout a Pokémon", '<label class="field" for="scout-q">Species<input type="search" id="scout-q" data-live="scout" autocomplete="off" placeholder="Throh, Golurk, Garganacl…"></label><div id="scout-hits" class="chips"></div><div id="scout-card">' + card + "</div>",
      "from game data, no sync needed", ' id="scout-panel"');
  }

  ui.live("scout", function (input) {
    var box = document.getElementById("scout-hits");
    if (!box) return;
    var hits = data.search(input.value, 10);
    box.innerHTML = hits.map(function (x) { return H.monChip(x.id, 0); }).join("");
  });
  ui.on("scout", function (t) {
    ui.state.scout = Number(t.getAttribute("data-id")) || 0;
    ui.state.scoutForm = Number(t.getAttribute("data-form")) || 0;
    if (ui.state.tab !== "carry" && ui.state.tab !== "run") ui.state.tab = "carry";
    ui.persist(); ui.render();
    var p = document.getElementById("scout-panel");
    if (p && p.scrollIntoView) p.scrollIntoView({ block: "nearest" });
  });

  ui.field = { waveLine: waveLine, foeCard: foeCard, ruler: ruler, lurePanel: lurePanel, scoutPanel: scoutPanel, itemList: itemList, odds: odds };
})();

/* 53-ui-carry.js */
/* Phase 2: the carry phase and its splice list. */
(function () {
  "use strict";
  var ui = NZ.ui, util = NZ.util, data = NZ.data, kb = NZ.kb, adv = NZ.advisor, h = util.esc, H = ui.html, F = ui.field;

  function nowPanel(ctx) {
    var s = ctx.session;
    if (!s) {
      return H.panel("This wave", H.callout("plain", "Nothing synced yet",
        'With a synced save this panel lists the wild Pokémon in front of you and flags the ones the build needs: a move for an open splice step, a Sturdy or lure ability, or Carbos to dump. <button type="button" class="btn link" data-act="tab" data-tab="sync">Set up sync</button> or <button type="button" class="btn link" data-act="sample" data-sample="carry">look at a sample wave</button>.'), "");
    }
    var info = adv.waveInfo(s.wave);
    var scans = s.enemies.map(function (e) { return adv.scanEnemy(e, ctx, "carry"); });
    var foes = s.enemies.map(function (e, i) { return F.foeCard(e, scans[i], ctx); }).join("");
    var wanted = scans.filter(function (x) { return x.wanted; }).length;
    var head = wanted ? H.callout("shiny", wanted === 1 ? "One of these is worth catching" : wanted + " of these are worth catching", "Catch before Regigigas knocks it out. Balls cannot be thrown while two wild Pokémon are on the field: remove the other one first.")
      : "";
    var forced = info.forced ? H.callout("danger", adv.kindLabel(info.kind), "A forced single boss: no fleeing, no catching. Regigigas handles it during the carry phase.") : "";
    var next = '<p class="sub">Next forced boss: wave ' + util.fmt(info.nextForced) + " (" + h(adv.kindLabel(info.nextForcedKind)) + ")" + (info.toForced ? ", in " + info.toForced + " waves." : ", now.") + "</p>";
    return H.panel("This wave", F.waveLine(s) + forced + head + '<div class="foes">' + (foes || '<p class="sub">No wild Pokémon in this save.</p>') + "</div>" + next,
      "synced " + h(util.ago(ui.game.at)));
  }

  function carryKit(ctx) {
    var m = ctx.assign.byRole.carry;
    var kit = [
      { keys: ["ROCK_SLIDE", "LANDS_WRATH"], label: "Rock Slide (TM) or Land's Wrath", why: "spread move for doubles; Land's Wrath is stronger, and Ground-type when Neutralizing Gas turns Normalize off" },
      { keys: ["STORM_THROW", "DARKEST_LARIAT"], label: "Storm Throw or Darkest Lariat", why: "single targets" },
      { keys: ["ENDURE"], label: "Endure (TM)", why: "survive a hit and collect berry boosts" },
      { keys: ["ENTRAINMENT", "PROTECT"], label: "Protect, until Entrainment arrives", why: "the last slot is held for Entrainment" }
    ];
    var rows = kit.map(function (k) {
      var st = m ? (k.keys.some(function (key) { return adv.knows(m, key); }) ? "ok" : "locked") : "manual";
      return '<li class="check">' + H.mark(st === "manual" ? "info" : st) + '<div><div class="check-label">' + h(k.label) + '</div><div class="check-detail">' + h(k.why) + "</div></div></li>";
    }).join("");

/* Getting save data into the page. Everything here is one-way: the page listens, reads and decodes.

NZ.bridge = (function () {
  "use strict";

      "var last={},sysAt=0;",
      "// the saves that changed since the last hand-over; the large unlock save goes at most every 10 minutes",

      "var first;try{first=pack(true,false);}catch(e){note('this tab is not allowed to read its own storage.');return;}",
      "if(!first){note('no PokéRogue save found in this tab. Log in and load your run first.');return;}",
      "if(W.opener&&!W.opener.closed&&/^nz-live/.test(W.name)){",
      "var post=function(m){if(m){try{W.opener.postMessage(m,ORIGIN);}catch(e){}}};",
      "var timer=setInterval(function(){if(!W.opener||W.opener.closed){clearInterval(timer);W.__nzBridge=null;note('the assistant page was closed. Live link off.');return;}post(pack(false,true));},1000);",
      "post(first);",
      "W.__nzBridge=function(){post(pack(true,false));note('live link refreshed.');};",
      "note('live link on. Read-only: nothing is sent to the game.');",
      "}else{",
      "var YES='save copied. Paste it into the assistant (Ctrl+V).',NO='the browser blocked the copy. Click “Copy save” in the corner of this tab.';",
      "var copyText=function(text,clicked){var ok=false,ta;",
      "if(clicked&&navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(function(){note(YES);},function(){copyText(text,false);});return;}",
      "ta=D.createElement('textarea');ta.value=text;ta.setAttribute('readonly','');ta.setAttribute('style','position:fixed;top:0;left:0;width:1px;height:1px;opacity:0');D.body.appendChild(ta);ta.focus();ta.select();try{ok=D.execCommand('copy');}catch(e){}ta.remove();",
      "if(!ok){try{if(typeof copy==='function'&&/Command Line API|native code/.test(String(copy))){copy(text);ok=true;}}catch(e){}}",
      "note(ok?YES:NO);};",
      "var chip=D.createElement('div'),x=D.createElement('span');",
      "chip.textContent='Copy save';chip.title='Normalize Assistant bridge: copies your save so you can paste it into the assistant. It never touches the game.';",

      "x.textContent=' ×';x.title='Remove this button';chip.appendChild(x);",
      "chip.addEventListener('mousedown',function(e){e.preventDefault();});",

  function pageOrigin() {

    var changed = [], prevWave = game.session ? game.session.wave : null, prevTs = game.session ? game.session.timestamp : 0;
    if (game.sample) { game.session = null; game.system = null; game.sample = false; prevWave = null; prevTs = 0; }
    if (sessions.length) {
      sessions.sort(function (a, b) { return (b.raw.timestamp || 0) - (a.raw.timestamp || 0); });
      var newest = save.normalizeSession(sessions[0].raw);
      if (via !== "live" || newest.timestamp >= prevTs) {
        game.session = newest;
        changed.push("wave " + util.fmt(newest.wave) + (newest.endless ? "" : " (not an Endless run)") + ", " + newest.party.length + " Pokémon");
      }
    }
    if (systems.length) {
      systems.sort(function (a, b) { return (b.raw.timestamp || 0) - (a.raw.timestamp || 0); });

  /** Copy text for the player: the clipboard API, then the older command, then a selected text box to copy by hand. */

        ta.remove();
      } catch (e) { ok = false; }
      if (ok) done(); else byHand();
    };
    try { navigator.clipboard.writeText(text).then(done, older); } catch (e) { older(); }
  }
  ui.on("copy", function (t) {
    var which = t.getAttribute("data-what");
    copyOut(which === "bookmarklet" ? bookmarklet() : snippet(pageOrigin()),
      which === "bookmarklet" ? "Bookmark address copied. Paste it as the URL of a new bookmark." : "Snippet copied. Paste it into the PokéRogue tab's console.");
  });
  ui.on("copy-hide", function () { status.manualCopy = ""; ui.render(); });
  ui.on("bookmark-click", function (t, e) {
    e.preventDefault();
    ui.toast("Drag this to your bookmarks bar. It only does something in the PokéRogue tab.");
  });
  ui.bind("settings", function (path, value) { if (path === "settings.sound" && value) { primeAudio(); beep(); } });

  return { snippet: snippet, bookmarklet: bookmarklet, pageOrigin: pageOrigin, ingestText: ingestText, ingestEntries: ingestEntries, apply: apply,
    wire: wire, status: status, loadSample: loadSample, originAllowed: originAllowed, looksLikeSave: looksLikeSave };
})();

/* 61-ui-sync.js */
/* The Sync tab: how save data reaches the page, what is read, and the settings. */
(function () {
  "use strict";
  var ui = NZ.ui, util = NZ.util, data = NZ.data, kb = NZ.kb, adv = NZ.advisor, bridge = NZ.bridge, h = util.esc, H = ui.html;

  function statusPanel(ctx) {
    var g = ui.game, body;
    if (!g.session && !g.system) {
      body = H.callout("plain", "Nothing synced", "The assistant works without it: every checklist can be ticked by hand. Synced, it fills them in from your save and reads each wave for you.");
    } else {
      var rows = "";
      if (g.session) {
        var s = g.session;
        rows += "<dt>Run</dt><dd>" + (s.endless ? "Endless" : "Not an Endless run") + " · wave " + util.fmt(s.wave) + " · " + h(data.biomeName(s.biome)) + "</dd>" +
          "<dt>Party</dt><dd>" + s.party.map(function (m) { return h(m.name); }).join(", ") + "</dd>" +
          "<dt>On the field</dt><dd>" + (s.enemies.map(function (m) { return h(m.name); }).join(", ") || "–") + "</dd>" +
          "<dt>Detected phase</dt><dd>" + ({ carry: "Carry", run: "Running" }[adv.detectPhase(ctx)] || "–") + "</dd>" +
          "<dt>Game version</dt><dd>" + h(s.version || "?") + (s.version && s.version !== data.meta.version ? ' <span class="sub">(this page\'s data is ' + h(data.meta.version) + ")</span>" : "") + "</dd>";
      }
      if (g.system) rows += "<dt>Unlocks</dt><dd>" + Object.keys(g.system.starters).length + " starters, " + g.system.caught.length + " species caught, " + g.system.shiny.length + " shiny</dd>";
      rows += "<dt>Read</dt><dd>" + h(util.ago(g.at)) + " · " + ({ live: "live link", paste: "pasted", file: "from a file", sample: "sample data" }[g.via] || "") + "</dd>";
      body = '<dl class="kv">' + rows + '</dl><div class="row"><button type="button" class="btn small" data-act="forget">Forget synced data</button></div>';
    }
    if (bridge.status.lastError) body += H.callout("danger", "Last attempt failed", h(bridge.status.lastError));
    return H.panel("Status", body, "");
  }

  function bridgePanel() {
    var href = bridge.bookmarklet();
    return H.panel("The bridge bookmark",
      '<p class="note">A few lines of script you run in the PokéRogue tab. It reads the save the game keeps in that tab and hands it to this page. That is all it does.</p>' +
      '<div class="row"><a class="bookmarklet" id="bridge-link" href="' + h(href) + '" data-act="bookmark-click" draggable="true" title="Drag to your bookmarks bar">NZ bridge</a><span class="sub">Drag this to your bookmarks bar.</span></div>' +
      '<div class="row"><button type="button" class="btn small" data-act="copy" data-what="bookmarklet">Copy as a bookmark address</button><button type="button" class="btn small" data-act="copy" data-what="snippet">Copy as a console snippet</button></div>' +
      (bridge.status.manualCopy ? '<label class="field" for="copy-out">Copy this by hand<textarea id="copy-out" class="paste" readonly spellcheck="false">' + h(bridge.status.manualCopy) + '</textarea></label><div class="row"><button type="button" class="btn small" data-act="copy-hide">Hide</button></div>' : "") +
      '<p class="sub">If dragging does not work: make any bookmark, edit it and paste the copied address as its URL. Or open the PokéRogue tab\'s developer console (F12) and paste the snippet there.</p>' +
      H.details("bridge-code", "Read the script (" + bridge.snippet(bridge.pageOrigin()).length + " characters)", '<pre class="code-box" id="code-box">' + h(bridge.snippet(bridge.pageOrigin())) + "</pre>" +
        '<ul class="bullets"><li>It calls <code>localStorage.getItem</code> on the keys that start with <code>sessionData</code> and <code>data_</code>. Nothing else is read.</li><li>It never writes to storage, never touches the game canvas and never sends key or mouse input.</li><li>In a game tab opened from this page it posts the save here when it changes. In any other tab it copies the save to your clipboard and leaves a small Copy save button in the top right corner for the next wave.</li></ul>'),
      "run it once per game load");
  }

  function livePanel() {
    var st = bridge.status, g = ui.game, note = "";
    var liveNow = g.via === "live" && Date.now() - g.at < 120000;
    if (liveNow) note = H.callout("good", "Live", "Following your save: last update " + h(util.ago(g.at)) + ", " + st.messages + " update" + (st.messages === 1 ? "" : "s") + " this session.");
    else if (st.blocked) note = H.callout("warn", "This viewer did not allow opening the game from here", "Use copy and paste below, or open the offline copy of this assistant from your disk: there the live link works.");
    else if (st.isolated) note = H.callout("warn", "The browser isolated the game tab from this page", "A page inside this viewer cannot keep a link to a tab it opens. Use copy and paste below, or the offline copy of this assistant.");
    else if (st.opened) note = H.callout("plain", "Waiting for the bridge", "In the PokéRogue tab that just opened, click your NZ bridge bookmark once the game has loaded. If the notice in that tab says the link is on but nothing arrives here, the bookmark was made on another copy of this page: drag the one from this page instead.");
    if (st.rejectedOrigin) note += H.callout("warn", "Ignored a message from " + h(st.rejectedOrigin), "Live data is only accepted from " + h(ui.state.settings.gameUrl) + ". Change the game address in Settings if you play somewhere else.");
    return H.panel("Live link",
      '<p class="note">The page follows your run by itself and updates at the start of every wave, when the game writes its save.</p>' +
      '<ol class="numbered"><li><div><strong>Open the game from here.</strong><div class="d">The live link only works for a game tab this page opened itself.</div></div></li>' +
      '<li><div><strong>Load your run, then click the NZ bridge bookmark in that tab.</strong><div class="d">A small notice confirms the link. Click it again after you reload the game.</div></div></li></ol>' +
      '<div class="row"><button type="button" class="btn primary" data-act="open-game">Open PokéRogue</button><span class="sub">' + h(ui.state.settings.gameUrl) + "</span></div>" + note,
      "automatic, every wave");
  }

  function pastePanel() {
    return H.panel("Copy and paste",
      '<ol class="numbered"><li><div><strong>In the PokéRogue tab, click the NZ bridge bookmark.</strong><div class="d">A notice says the save was copied, and a small Copy save button appears in the top right corner of that tab.</div></div></li>' +
      '<li><div><strong>Come back here and press Ctrl+V anywhere on this page.</strong><div class="d">Or paste into the box.</div></div></li>' +
      '<li><div><strong>On later waves, click Copy save in the game tab and paste again.</strong><div class="d">The button stays until you reload the game or close it with ×.</div></div></li></ol>' +
      '<label class="field" for="paste-box">Pasted save<textarea id="paste-box" class="paste" placeholder="Paste here" spellcheck="false"></textarea></label>' +
      '<div class="row"><button type="button" class="btn" data-act="paste-go">Read the pasted save</button></div>', "works everywhere, one paste per check");
  }

  function filePanel() {
    return H.panel("Export file",
      '<p class="note">No script at all: in the game open Menu, then Manage Data, then Export Session (your run) or Export Data (your unlocks), and drop the <code>.prsv</code> file here. An exported session is the server copy, which the game updates every five waves, so it can be a few waves behind.</p>' +
      '<div class="drop" id="drop-zone"><strong>Drop .prsv files anywhere on this page</strong><label class="btn" for="file-pick">Choose files</label><input class="sr" type="file" id="file-pick" accept=".prsv,.json,.txt" multiple></div>', "");
  }

  function settingsPanel() {
    var s = ui.state.settings;
    return H.panel("Settings",
      '<label class="switch"><input type="checkbox" id="set-peek" data-bind="settings.peek"' + (s.peek ? " checked" : "") + "><span>Show hidden enemy details</span></label>" +
      '<p class="sub">Off: the assistant only uses what the game shows you (species, level, boss bars, shiny, held items) plus what that species can have. On: it also reads each wild Pokémon\'s real ability, moves and Speed from the save, which the game does not show. Your call.</p>' +
      '<label class="switch"><input type="checkbox" id="set-sound" data-bind="settings.sound"' + (s.sound ? " checked" : "") + "><span>Sound when a wave is worth staying for</span></label>" +
      '<p class="sub">Live link only. A short two-note beep for shinies, Pokémon missing from your dex and pieces of the build.</p>' +
      '<label class="switch"><input type="checkbox" id="set-sound-items" data-bind="settings.soundItems"' + (s.soundItems ? " checked" : "") + (s.sound ? "" : " disabled") + "><span>Also for items worth stealing</span></label>" +
      '<p class="sub">Lucky and Golden Eggs get common on wild Pokémon at high waves, so this one is off by default.</p>' +
      '<label class="field" for="set-url">Game address<input type="text" id="set-url" data-bind="settings.gameUrl" value="' + h(s.gameUrl) + '" spellcheck="false"></label>', "");
  }

  function samplePanel() {
    return H.panel("Try it with a sample", '<p class="note">Example saves in the game\'s real format, to see what a synced page looks like. They are not your run.</p><div class="chips">' +
      '<button type="button" class="chip" data-act="sample" data-sample="carry">Carry phase, wave 734</button>' +
      '<button type="button" class="chip" data-act="sample" data-sample="shiny">Running, a shiny on wave 1763</button>' +
      '<button type="button" class="chip" data-act="sample" data-sample="plain">Running, nothing on wave 1764</button>' +
      '<button type="button" class="chip" data-act="sample" data-sample="boss">Slither Wing on wave 2350</button></div>', "");
  }

  function aboutPanel() {
    return H.panel("What this page reads and keeps",
      '<ul class="bullets"><li><strong>Read-only.</strong> The assistant does not play. It cannot press a key, click, or change a save.</li>' +
      "<li>From a session save it keeps the wave, your party, held items, balls, money and the wild Pokémon of the current wave. From a system save it keeps starter unlocks and which species you have caught.</li>" +
      "<li>Trainer and secret ids are dropped. Nothing leaves your browser: the decoded summary is stored in this browser only, so a reload keeps it.</li>" +
      "<li>The game writes its save at the start of each wave, so the page is at most one wave behind what you see.</li></ul>" +
      '<h3 class="h">Sources</h3><ul class="bullets">' + kb.sources.map(function (s) { return '<li><a href="' + h(s.url) + '" target="_blank" rel="noopener noreferrer">' + h(s.label) + "</a></li>"; }).join("") + "</ul>", "");
  }

  ui.views.sync = function (ctx) {
    return '<div class="view-head"><p class="eyebrow">Sync</p><h1>Let the assistant read your run</h1><p class="lede">It reads the save the game keeps in your browser. It never sends anything to the game.</p></div>' +
      '<div class="cols"><div class="col">' + statusPanel(ctx) + bridgePanel() + livePanel() + pastePanel() + filePanel() + '</div><div class="col">' + settingsPanel() + samplePanel() + aboutPanel() + "</div></div>";
  };
})();

/* 90-main.js */
/* Boot. */
(function () {
  "use strict";
  function start() {
    NZ.data.init(window.NZ_DATA);
    NZ.ui.load();
    NZ.ui.wire();
    NZ.bridge.wire();
    var hash = "";
    try { hash = (location.hash || "").replace("#", ""); } catch (e) { hash = ""; }
    if (["party", "carry", "run", "sync"].indexOf(hash) !== -1) NZ.ui.state.tab = hash;
    NZ.ui.render();
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", start);
  else start();
})();
